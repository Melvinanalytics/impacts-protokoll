<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__POLICY__">
<title></title>
<style>
/* Shared approved mockup tokens, including the route map. */
:root {
 --bg:#ffffff;--ink:#121212;--muted:#6b6b6b;--soft:#f3f3f1;--line:#e3e3df;
 --open:#c2410c;--open-bg:#fff4ed;--derived:#8a6d1d;--gate:#3346a8;--gate-bg:#eef0fb;
 --go:#2f7d32;--go-ink:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.04);
 --panel:var(--soft);--hair:var(--line);--strong:var(--muted);--action:var(--ink);--action-ink:var(--bg);
 --done:var(--muted);--done-tint:var(--soft);--now:var(--go);--now-ink:var(--go-ink);
 color-scheme:light;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#131312;--ink:#f1f0ec;--muted:#a3a29c;--soft:#1e1e1c;--line:#33332f;
 --open:#fb923c;--open-bg:#2a1a10;--derived:#d6b65c;--gate:#a5b4fc;--gate-bg:#1c1f33;
 --go:#4caf50;--go-ink:#0b0b0b;color-scheme:dark;
}}
:root[data-theme="dark"]{
 --bg:#131312;--ink:#f1f0ec;--muted:#a3a29c;--soft:#1e1e1c;--line:#33332f;
 --open:#fb923c;--open-bg:#2a1a10;--derived:#d6b65c;--gate:#a5b4fc;--gate-bg:#1c1f33;
 --go:#4caf50;--go-ink:#0b0b0b;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
a.go{display:inline-flex;align-items:center;gap:4px;min-height:24px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer;min-height:24px;display:inline-flex;align-items:center;gap:6px}
button:hover{border-color:var(--strong)}
button.plain{border:0;padding:0;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;font-weight:inherit;display:inline;min-height:0;overflow-wrap:anywhere}
button.plain:hover{text-decoration-color:var(--ink)}
button.source-control,button.source-ref,button.stated{border:0;padding:0;display:inline;min-height:0;font:inherit;color:inherit;background:none;text-align:inherit;overflow-wrap:anywhere;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.source-dialog{width:min(780px,calc(100vw - 32px));max-height:85vh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:20px}
.source-dialog::backdrop{background:rgba(0,0,0,.35)}
.source-dialog h2{font-size:18px;margin:0 0 12px}.source-dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}
@media print{.source-dialog{display:none}}
.primary{background:var(--action);color:var(--action-ink);border-color:var(--action)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}
.ic{flex:none;vertical-align:-3px}
h1,h2,h3,h4,p,li,dd,td,th{overflow-wrap:break-word;hyphens:auto}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace}

/* Karte */
#map-head{padding:16px 16px 6px;display:grid;gap:8px;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif}
#map-head h1{font-size:20px;font-weight:600;margin:0}
.lede{margin:0;max-width:1000px}
.muted{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.legend{font-size:12px;color:var(--muted)}
.legend>summary{display:none;cursor:pointer}
.legend .items{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.legend .li{display:inline-flex;align-items:center;gap:6px}
.kchip{display:inline-grid;place-items:center;min-width:24px;height:18px;border:1px solid var(--muted);border-radius:3px;font-size:10px;font-weight:700;color:var(--ink)}
.wrap{overflow:auto;padding:0 16px 16px}
svg text{font:12.5px -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;pointer-events:none}
svg text.kc{font-size:10px;font-weight:700}
.edge{fill:none;stroke:var(--line)}.edge.on{stroke:var(--now);stroke-width:3}.edge.ok{stroke:var(--done);stroke-width:1.5}.edge.wait{stroke:var(--strong);stroke-width:1.5;stroke-dasharray:5 4}
.node{cursor:pointer}.node:hover .frame{stroke-width:2}
.node .ring{fill:none;stroke:none}
.node.sel .ring,.node:focus-visible .ring{stroke:var(--ink);stroke-width:1.5}
.node:focus-visible{outline:2px solid var(--ink)}
aside{position:fixed;top:0;right:0;width:min(440px,100vw);height:100vh;overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:16px;transform:translateX(100%);transition:transform .15s;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif}
aside.open{transform:none}
aside h2{font-size:17px;margin:0}
.phead{position:sticky;top:-16px;margin:-16px -16px 8px;padding:16px;background:var(--panel);border-bottom:1px solid var(--hair);display:flex;gap:10px;align-items:flex-start;justify-content:space-between;z-index:1}
.phead>button{flex:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
@media (prefers-reduced-motion:reduce){aside{transition:none}}

/* Blatt und Übersicht */
.sheet{font:15px/1.45 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1280px;margin:0 auto;padding:20px 28px 64px}
.levels{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:22px}
.levels>a,.levels>button,.levels>span.crumb{display:inline-flex;align-items:center;gap:8px;color:var(--muted);border:1px solid var(--hair);border-radius:999px;padding:6px 14px 6px 6px;font:13px -apple-system,BlinkMacSystemFont,"Inter",sans-serif;text-decoration:none;min-height:24px}
.levels b{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 4px;border-radius:13px;background:var(--soft);color:var(--ink);font-size:11px}
.levels [aria-current="page"]{color:var(--ink);border-color:var(--ink)}
.levels [aria-current="page"] b{background:var(--ink);color:var(--bg)}
.levels .sep{color:var(--line);font-size:18px}
.levels .karte{margin-left:auto}
.head{display:grid;grid-template-columns:190px minmax(0,1fr);border-bottom:2px solid var(--ink);padding-bottom:18px}
.mark{padding-right:24px}
.mark .big{font-size:32px;line-height:1;font-weight:700;letter-spacing:-.02em}
.mark .sub{margin-top:8px;font-size:12px;letter-spacing:.08em;font-weight:600;text-transform:uppercase}
.headmain{border-left:1px solid var(--hair);padding-left:24px;display:grid;gap:10px;align-content:center;min-width:0}
.headmain h1{margin:0;font-size:34px;line-height:1.2;overflow-wrap:anywhere}
.headmain p{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--hair);max-width:100%;vertical-align:1px}
.b-now{background:var(--now);color:var(--now-ink);border-color:var(--now)}
.b-next{border:1.5px dashed var(--now)}
.b-wait{background:var(--soft);border:1px dashed var(--strong)}
.b-done{color:var(--done);border-color:var(--done)}
.b-looped{color:var(--muted);border:1px dashed var(--done)}
.b-possible{border:1px dashed var(--line);color:var(--muted)}
.b-option{border-color:var(--ink)}
.b-past{border:1px dashed var(--muted);color:var(--muted)}
.b-future{color:var(--muted)}
.b-reached{border-color:var(--ink)}
.b-open{color:var(--open);background:var(--open-bg);border-color:var(--open-bg)}
.b-gate{color:var(--gate);background:var(--gate-bg);border-color:var(--gate-bg)}
.b-source{border:1px dashed var(--strong);color:var(--muted)}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:start;gap:12px}
.kv>span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted);padding-top:9px}
.kv>span small{display:block;text-transform:none;letter-spacing:0;font-weight:400}
.kv>div{background:var(--soft);border-radius:6px;padding:8px 12px;min-height:38px;overflow-wrap:break-word;min-width:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px}
.stack{display:grid}
.sec{padding:22px 0;min-width:0;border-bottom:1px solid var(--hair)}
.sec.wide,.lead{grid-column:1/-1}
.lead{padding:18px 0 0;font-size:16px}
.lead p{margin:0 0 8px}
.stitle{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.stitle h2{flex:1 1 12em;min-width:0}
.stitle .no{font-size:22px;font-weight:700;min-width:30px}
.stitle h2{margin:0;font-size:19px;letter-spacing:.06em;text-transform:uppercase;font-weight:800;display:inline-flex;gap:8px;align-items:center}
.ssub{margin:2px 0 12px 44px;color:var(--muted);font-size:14px}
.origin{display:block;font-size:12px;color:var(--muted);letter-spacing:.02em;margin-top:2px;overflow-wrap:anywhere}
.box{background:var(--soft);border-radius:10px;padding:14px 16px;overflow-wrap:break-word}
.box>:first-child{margin-top:0}.box>:last-child{margin-bottom:0}
.box p{margin:0 0 8px}
.box h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 0 6px}
.box ul{margin:0 0 8px;padding-left:20px}
.box pre{background:var(--bg);border:1px solid var(--hair);border-radius:6px;padding:8px 10px;overflow:auto;font-size:12.5px;white-space:pre-wrap}
ul.list{list-style:none;padding-left:0}.list li{display:flex;gap:8px}.list .marker{color:var(--muted);min-width:1.4em;text-align:right;flex:none}
.list li>span:last-child{white-space:pre-line}.list .d1{margin-left:22px}.list .d2{margin-left:44px}.list .d3{margin-left:66px}
.tablewrap{overflow-x:auto;border:1px solid var(--hair);border-radius:10px;margin:0 0 8px;background:var(--bg)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--soft);vertical-align:bottom}
table.t td{padding:10px 12px;border-top:1px solid var(--hair);vertical-align:top}
tr.chosen td{background:var(--done-tint)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;margin:2px 6px 2px 0;border:1px solid var(--hair);color:var(--muted)}
.issues{color:var(--open)}
.note{color:var(--muted);font-size:13px;margin:8px 0 0}
.warnline{color:var(--open)}
small{font-size:12px;color:var(--muted)}
.line{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.line .ic{align-self:center}
.iline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px;align-items:start}
.iline>.ic{margin-top:2px}
footer{margin-top:26px;color:var(--muted);font-size:12px}
details>summary{cursor:pointer}
.rawdata{margin-top:18px}
.rawdata>summary{color:var(--muted);font-size:13px}
dl.raw{margin:6px 0;display:grid;gap:4px}
dl.raw>div{display:grid;grid-template-columns:minmax(120px,max-content) minmax(0,1fr);gap:10px}
dl.raw dt{color:var(--muted);font-size:12px}
dl.raw dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
ul.plain{margin:0;padding-left:18px}

/* Herkunft, Bedeutung, Grund */
.triad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 6px}
.triad>div{background:var(--soft);border-radius:10px;padding:12px 14px;min-width:0}
.triad dt{display:flex;gap:8px;align-items:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
.triad dd{margin:0;display:grid;gap:6px;font-size:14px;align-content:start}
.triad dd p{margin:0}
aside .triad,.why .triad,tr.why .triad{grid-template-columns:1fr}
.src{display:inline-block;border:1px solid var(--hair);border-radius:4px;padding:1px 6px;margin:0 4px 2px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.missing{color:var(--open);display:inline-flex;gap:6px;align-items:center}
details.why{margin-top:6px}
details.why>summary{color:var(--muted);font-size:12px;display:inline-flex;gap:6px;align-items:center;min-height:24px}
.ev{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:0 8px;margin:0 4px;border:1px solid var(--muted);color:var(--muted);vertical-align:1px;white-space:nowrap}
.ev-verified{border-color:var(--ink);color:var(--ink)}
.ev-hypothesis{border:1px dashed var(--derived);color:var(--derived)}
.ev-open{border-color:var(--open-bg);background:var(--open-bg);color:var(--open)}
.rchip{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:2px 6px 2px 0;font-size:13px}
.rchip.chosen{background:var(--done-tint);border-color:var(--done)}
.trail{display:inline-flex;gap:3px;align-items:center;margin-right:6px}
.c-done{color:var(--done)}.c-now{color:var(--now)}.c-wait{color:var(--muted)}.c-open{color:var(--open)}.c-gate{color:var(--gate)}
.timeline{list-style:none;margin:0;padding:0 0 0 10px;border-left:2px solid var(--hair)}
.timeline>li{position:relative;padding:0 0 14px 18px}
.timeline>li>.ic{position:absolute;left:-19px;top:2px;background:var(--soft)}

/* Notwendigkeit */
.nec{border:1px solid var(--hair);border-radius:12px;padding:16px;background:var(--bg);margin:10px 0 14px}
.nec .stitle h3{margin:0;font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.nec .ssub{margin-left:0}
.legendline{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin:6px 0 10px}
.legendline span{display:inline-flex;gap:5px;align-items:center}
table.nt th.c{text-align:center;padding-left:6px;padding-right:6px;text-transform:none;letter-spacing:0;font-size:12px;white-space:nowrap;hyphens:manual}
table.nt th.c .ic{display:block;margin:0 auto 4px}
table.nt th small{display:block;text-transform:none;letter-spacing:0;font-weight:400}
table.nt td.c{text-align:center;width:1%}
.mk{flex-direction:column;gap:2px;border-color:transparent;padding:4px 6px;font-size:12px}
.mk .full{display:none}
.mk.hit{border-color:var(--ink)}
.act{font-weight:700}
.idchip{border-radius:999px;padding:0 8px;font-size:12px;font-weight:700;border-color:var(--ink);min-height:22px}
.idchip.open{border:1.5px dashed var(--open);color:var(--open)}
.idchip.sample{display:inline-flex;align-items:center;border:1.5px dashed var(--open);border-radius:999px;padding:0 8px;font-weight:700;color:var(--open)}
.cond{display:flex;gap:6px;align-items:flex-start;margin:0 0 4px;font-size:12px}
.cond .ctext{color:var(--muted);min-width:12em}
.whyb{flex-direction:row;gap:2px;margin-top:6px;padding:2px 6px;border-color:var(--hair);color:var(--muted)}
.qline small.q{display:block;margin:0 0 2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin:4px 4px 0 0;color:var(--open);background:var(--open-bg)}
tr.why>td{background:var(--soft)}
.qline{display:flex;gap:6px;align-items:flex-start;padding:4px 6px;border-radius:6px}
.qline.hit{outline:1px solid var(--ink)}
.qlist{margin:6px 0 0;padding-left:20px}
.qlist li{margin:0 0 6px}
.lead details.comment>summary,.box details.comment>summary{color:var(--muted);font-size:12px}

.zsteps{display:grid;gap:6px;margin:10px 0;padding:10px 12px;border:1px solid var(--hair);border-radius:10px;background:var(--bg)}
.zstep{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.zlist{border:1px solid var(--hair);border-radius:10px;background:var(--bg)}
.zhead,.zrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:16px;padding:10px 12px}
.zhead{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--hair)}
.zrow+.zrow{border-top:1px solid var(--hair)}
.zist,.zziel{display:grid;gap:4px;align-content:start;min-width:0}
.zmove{color:var(--muted)}
.z-gone .zist .act{color:var(--muted)}
.zgone{border-style:dashed}
.xk{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:0 8px;margin:0 4px 2px 0;color:var(--ink);white-space:nowrap}
@media (max-width:960px){
 .head{grid-template-columns:1fr;gap:14px}.headmain{border-left:0;padding-left:0}
 .grid{grid-template-columns:1fr}.page{padding:16px}.mark{display:flex;gap:10px;align-items:baseline;padding:0}.mark .big{font-size:22px}.mark .sub{margin:0}.headmain h1{font-size:28px}.ssub{margin-left:0}
 .triad{grid-template-columns:1fr}
}
@media (max-width:700px){
.zhead{display:none}.zrow{grid-template-columns:minmax(0,1fr);gap:6px}
 table.rt,table.rt tbody,table.rt tr,table.rt td{display:block}
 table.rt thead{display:none}
 table.rt tr{border-top:1px solid var(--hair);padding:8px 0}
 table.rt td{border:0;padding:4px 12px}
 table.rt td::before{content:attr(data-label);display:block;font-size:12px;color:var(--muted)}
 table.nt td.c{text-align:left;width:auto}
 table.nt .mk{display:flex;flex-direction:row;align-items:flex-start;text-align:left;width:100%;padding:4px 0}
 table.nt .mk .w{display:none}
 table.nt .mk .full{display:inline}
 table.nt td.c::before{display:none}
 .kv{grid-template-columns:1fr;gap:4px}.kv>span{padding-top:0}
}
@media (max-width:640px){
 .legend>summary{display:list-item}
 .levels .anc:not(.keep) .t{display:none}
 .levels .anc:not(.keep){padding-right:6px}
}

/* Approved process-sheet layout. Palette is shared by every view. */
.sheet.mock-sheet{min-height:100vh}
.mock-sheet .head{grid-template-columns:300px minmax(0,1fr) minmax(0,1fr)}
.mock-sheet .mark .big{font-size:88px;line-height:.9;font-weight:800;letter-spacing:-.04em}
.mock-sheet .mark .sub{margin-top:10px;font-size:13px;letter-spacing:.28em}
.mock-sheet .meta{border-left:1px solid var(--line);padding-left:24px;display:grid;gap:8px;align-content:center;min-width:0}
.mock-sheet .meta+.meta{margin-left:24px}
.mock-sheet .kv{grid-template-columns:120px minmax(0,1fr);align-items:center}
.mock-sheet .kv>span{font-size:11px;letter-spacing:.14em;padding-top:0}
.mock-sheet .kv h1{font-size:15px;line-height:1.45;margin:0;font-weight:600}
.mock-sheet .evidence-legend{margin-left:auto;display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.evidence-legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.evidence-legend .src-dot{border:1px solid var(--muted)}
.evidence-legend .der-dot{border:2px dashed var(--derived)}
.evidence-legend .open-dot{background:var(--open)}
.mock-sheet .levels .karte{margin-left:0}
.mock-sheet .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.mock-sheet .sec{padding:22px 24px 22px 0;border-bottom:0}
.mock-sheet .sec+.sec,.mock-sheet .row>.stack{padding-left:24px;border-left:1px solid var(--line)}
.mock-sheet .row>.stack{padding-left:0;align-content:start}
.mock-sheet .stack .sec{padding-left:24px;border-left:0}
.mock-sheet .stack .sec+.sec{border-top:1px solid var(--line)}
.mock-sheet .sec.wide{grid-column:span 2}
.mock-sheet .sec.full{grid-column:1/-1}
.mock-sheet .stitle{flex-wrap:nowrap;gap:14px}.mock-sheet .stitle h2{flex:1;min-width:0}.mock-sheet .stitle .no{flex:none}
.mock-sheet .origin{font-size:11px;letter-spacing:.04em;opacity:.8}
.mock-sheet table.t th{font-size:11px;letter-spacing:.12em;white-space:nowrap}
.mock-sheet table.t td small{display:block;margin-top:2px}
.mock-sheet table.nt th.c,.mock-sheet table.nt td.c{width:34px;text-align:center;padding-left:4px;padding-right:4px}
.mock-sheet .nt{min-width:760px}
.mock-sheet .box:has(.tablewrap){background:transparent;padding:0}
.mock-sheet .answer{position:relative}
.mock-sheet .answer>summary{list-style:none;display:inline-grid;place-items:center;width:20px;height:20px;cursor:pointer}
.mock-sheet .answer>summary::-webkit-details-marker{display:none}
.mock-sheet .answer[open]{min-width:130px;text-align:left}
.mock-sheet .answer .answer-text{font-size:12px;margin-top:8px}
.mock-sheet .execution-list{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.mock-sheet .execution-list li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start}
.mock-sheet .execution-list .ic{margin-top:1px}
.mock-sheet #s-open small{display:block;margin-top:2px}
.mock-sheet .b-next{border-color:var(--derived)}
.mock-sheet .b-done,.mock-sheet .c-done{color:var(--muted);border-color:var(--line)}
.mock-sheet .tablewrap table.rt,.mock-sheet .tablewrap table.rt tbody{display:table}
.mock-sheet .tablewrap table.rt tbody{display:table-row-group}
.mock-sheet .tablewrap table.rt tr{display:table-row;border:0}
.mock-sheet .tablewrap table.rt td{display:table-cell;border-top:1px solid var(--line);padding:10px 12px}
.mock-sheet .tablewrap table.rt thead{display:table-header-group}
.mock-sheet .tablewrap table.rt td::before{display:none}
.mock-sheet .tablewrap table.rt td.c{padding-left:4px;padding-right:4px;text-align:center;width:34px}
@media(max-width:960px){
 .mock-sheet .head{grid-template-columns:1fr;gap:14px}.mock-sheet .meta{border-left:0;padding-left:0}.mock-sheet .meta+.meta{margin-left:0}
 .mock-sheet .mark{display:block}.mock-sheet .mark .big{font-size:64px}
 .mock-sheet .row{grid-template-columns:1fr}.mock-sheet .sec,.mock-sheet .sec+.sec,.mock-sheet .stack .sec,.mock-sheet .row>.stack{padding:18px 0;border-left:0}
 .mock-sheet .sec+.sec,.mock-sheet .row>.stack,.mock-sheet .stack .sec+.sec{border-top:1px solid var(--line)}
 .mock-sheet .sec.wide,.mock-sheet .sec.full{grid-column:auto}.mock-sheet .evidence-legend{margin-left:0;width:100%}
}
.file-stand{display:block;font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere;margin-top:4px}
.file-stand code{font:inherit}
.origin .source-ref{display:inline}
.more-sources,.more-sources>summary{display:inline}.more-sources>summary{margin-left:6px;text-decoration:underline}
.more-sources>summary::-webkit-details-marker{display:none}
.more-sources:not([open])>span{display:none}
.expandable{margin-bottom:8px}
.collapse-body{position:relative;max-height:5.8em;overflow:hidden}.collapse-body.tall{max-height:16em}
.expandable:not(.expanded) .collapse-body::after{content:"";position:absolute;inset:auto 0 0;height:1.5em;background:linear-gradient(transparent,var(--soft));pointer-events:none}
.expandable.expanded>.collapse-body{max-height:none;overflow:visible}
.collapse-toggle{margin-top:4px;font-size:12px;color:var(--muted);border-color:var(--line);border-radius:999px}
@media print{
 .expandable>.collapse-body{max-height:none!important;overflow:visible!important}
 .collapse-body::after,.collapse-toggle{display:none!important}
 .tablewrap{overflow:visible}.mock-sheet .nt{min-width:0}
 aside{position:static;height:auto;transform:none}
}

        h("div", {class: "headmain"}, h("h1", {text: title(n)}),
          h("div", {class: "pills"}, phase ? badge(phase) : null, gate ? gatePill() : null, sacred ? sacredPill() : null),
          run ? h("div", null, standSentence(stand)) : null)),
      nodeTriad(id),
      h("div", {class: "grid"}, cards, sectionCards(n), children(n)),
      rawDetails(W.alle_angaben_aus_dem_dateikopf, withoutKeys(n.meta, ["type", "id", "laufpfad", "application_revision"]), ref),
      footer());
    document.title = level + ": " + title(n);
  }

  function runSheet() {
    sheetMode(false);
    const st = stand;
    const possible = st.kind === "waiting" ? st.routes.filter(r => r[3] !== "end" && view.phase[r[1]] === "possible") : [];
    put(crumbs([crumb("V", runTitle)], toMap),
      h("header", {class: "head"}, markHead("V", W.vorgang),
        h("div", {class: "headmain"}, h("h1", {text: runTitle}), h("div", {class: "pills"}, standBadge(st)), h("div", null, standSentence(st)),
          possible.length ? kv(W.laut_routen_moglich_3, [possible.map(r => h("span", {class: "tag", text: r[2]})), W.aus_2 + quote(st.step_title)]) : null)),
      nodeTriad(run.id),
      h("div", {class: "grid"}, card(null, W.verlauf, W.jeder_eintrag_in_reihenfolge_der_datei, run.path + " · laufpfad", timeline(entries.map((e, i) => [e, i + 1])), true),
        sectionCards(run)),
      rawDetails(W.alle_angaben_aus_dem_dateikopf, withoutKeys(run.meta, ["type", "id", "laufpfad"]), ref),
      footer());
    document.title = W.vorgang_2 + runTitle;
  }

  function render() {
    let id = "";
    try { id = decodeURIComponent(location.hash.slice(1)); } catch { id = ""; }
    if (nodes.has(id)) { hidePanel(false); show("sheet-view"); sheet(id); currentSheet = id; window.scrollTo(0, 0); return false; }
    currentSheet = null;
    show("map-view");
    document.title = (run ? runTitle : title(hp)) + W.karte_2;
    return true;
  }

  const svg = document.getElementById("map");
  svg.setAttribute("aria-label", W.karte_3 + title(hp));
  mapHead();
  draw();
  window.addEventListener("popstate", render);
  window.addEventListener("hashchange", render);
  if (render() && run && position) {
    const box = boxElement(position.key);
    /* Scroll by arithmetic: scrollIntoView would move the browser's sequential focus start past the page head. */
    const wrap = document.querySelector("#map-view .wrap");
    if (box && wrap) {
      const r = box.getBoundingClientRect(), w = wrap.getBoundingClientRect();
      wrap.scrollLeft += r.left + r.width / 2 - (w.left + w.width / 2);
      if (r.top < 0 || r.bottom > window.innerHeight) window.scrollBy(0, r.top + r.height / 2 - window.innerHeight / 2);
    }
  }
}

if (MODEL.kind === "overview") overviewPage();
else if (MODEL.issues.length) refusedPage();
else if (MODEL.kind === "ist-prozess") istPage();
else selectionPage();
}
</script>
