<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="IMPACTS Protocol Hero Diagram">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#efefe9" stroke-width="1"/>
    </pattern>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#666660"/>
    </marker>
    <marker id="arrow-go" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2f7d32"/>
    </marker>
    <marker id="arrow-gate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#3346a8"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c2410c"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="14" fill="#ffffff" stroke="#e1e1da" stroke-width="1"/>
  
  <rect x="1" y="1" width="1198" height="358" rx="13" fill="url(#grid)"/>
  <!-- Left editorial block -->
  <rect x="44" y="42" width="108" height="24" rx="12" fill="#121212"/>
  <text x="98" y="58" text-anchor="middle" class="mono" font-size="11" font-weight="700" letter-spacing="1.2" fill="#ffffff">PROTOCOL</text>
  <rect x="162" y="42" width="244" height="24" rx="12" fill="#f1f1ed" stroke="#e1e1da"/>
  <text x="284" y="58" text-anchor="middle" class="mono" font-size="11" fill="#666660">PLAIN FILES · GIT · ZERO SERVER</text>

  <text x="44" y="138" class="sans" font-size="60" font-weight="800" letter-spacing="-2" fill="#121212">IMPACTS</text>
  <text x="46" y="176" class="sans" font-size="19" font-weight="600" fill="#2c2c29">Folder-directed, plain-file protocol for</text>
  <text x="46" y="202" class="sans" font-size="19" font-weight="600" fill="#2c2c29">people and file-capable agents.</text>

  <text x="46" y="242" class="sans" font-size="14" fill="#666660">Design backwards from the owed Leistung. Cut unneeded work first.</text>
  <text x="46" y="263" class="sans" font-size="14" fill="#666660">Bind inputs, checks and human decisions in ordinary files + Git.</text>

  <!-- 3 bottom badges -->
  <g transform="translate(46, 290)">
    <rect x="0" y="0" width="142" height="30" rx="6" fill="#ebf6ec" stroke="#b8dfb9"/>
    <circle cx="16" cy="15" r="4" fill="#2f7d32"/>
    <text x="28" y="19" class="mono" font-size="11.5" font-weight="600" fill="#2f7d32">sha256 bound</text>

    <rect x="154" y="0" width="150" height="30" rx="6" fill="#eef0fb" stroke="#c2caf2"/>
    <circle cx="170" cy="15" r="4" fill="#3346a8"/>
    <text x="182" y="19" class="mono" font-size="11.5" font-weight="600" fill="#3346a8">gate: human</text>

    <rect x="316" y="0" width="166" height="30" rx="6" fill="#fbf6e5" stroke="#e5d59c"/>
    <circle cx="332" cy="15" r="4" fill="#8a6d1d"/>
    <text x="344" y="19" class="mono" font-size="11.5" font-weight="600" fill="#8a6d1d">static HTML view</text>
  </g>

  <!-- Right architectural proof chain panel -->
  <rect x="596" y="34" width="564" height="292" rx="12" fill="#f8f8f5" stroke="#c8c8be"/>
  <text x="620" y="60" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#666660">INSPECTABLE EXECUTION CHAIN</text>
  <text x="1136" y="60" text-anchor="end" class="mono" font-size="11" fill="#2f7d32">● valid</text>
  <line x1="620" y1="72" x2="1136" y2="72" stroke="#e1e1da"/>

  <!-- Node 1: Root Router -->
  <rect x="620" y="92" width="238" height="62" rx="8" fill="#ffffff" stroke="#c8c8be"/>
  <text x="634" y="114" class="mono" font-size="12" font-weight="700" fill="#121212">CONTEXT.md</text>
  <text x="844" y="114" text-anchor="end" class="mono" font-size="10" fill="#666660">ROUTE</text>
  <text x="634" y="135" class="mono" font-size="10" fill="#666660">Form: records/ Record Library</text>

  <!-- Arrow 1->2 -->
  <line x1="858" y1="123" x2="892" y2="123" stroke="#666660" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- Node 2: Hauptprozess -->
  <rect x="898" y="92" width="238" height="62" rx="8" fill="#ffffff" stroke="#c8c8be"/>
  <text x="912" y="114" class="mono" font-size="12" font-weight="700" fill="#121212">hauptprozesse/offer/</text>
  <text x="912" y="135" class="mono" font-size="10.5" fill="#8a6d1d">git-tree:a9f3e1…</text>

  <!-- Vertical arrow 2->4 -->
  <line x1="1017" y1="154" x2="1017" y2="188" stroke="#2f7d32" stroke-width="1.8" marker-end="url(#arrow-go)"/>

  <!-- Node 3: Vorgang -->
  <rect x="620" y="194" width="238" height="66" rx="8" fill="#ebf6ec" stroke="#b8dfb9"/>
  <text x="634" y="216" class="mono" font-size="12" font-weight="700" fill="#2f7d32">vorgaenge/case-042/</text>
  <text x="634" y="234" class="mono" font-size="10" fill="#2c2c29">gelesen:     sha256:9d1c…</text>
  <text x="634" y="249" class="mono" font-size="10" fill="#2c2c29">geschrieben: sha256:4b82…</text>

  <!-- Node 4: Human Gate -->
  <rect x="898" y="194" width="238" height="66" rx="8" fill="#eef0fb" stroke="#c2caf2"/>
  <text x="912" y="216" class="mono" font-size="12" font-weight="700" fill="#3346a8">gate: human</text>
  <text x="1122" y="216" text-anchor="end" class="mono" font-size="10" fill="#3346a8">EXPLICIT</text>
  <text x="912" y="234" class="mono" font-size="10.5" fill="#2c2c29">by: human:clara</text>
  <text x="912" y="249" class="mono" font-size="10.5" fill="#666660">route: freigegeben</text>

  <!-- Arrow 4->3 -->
  <line x1="898" y1="227" x2="864" y2="227" stroke="#3346a8" stroke-width="1.8" marker-end="url(#arrow-gate)"/>

  <!-- Bottom CLI strip inside panel -->
  <rect x="620" y="276" width="516" height="32" rx="6" fill="#f1f1ed" stroke="#e1e1da"/>
  <text x="634" y="296" class="mono" font-size="11.5" fill="#2c2c29">$ impacts validate .  ·  impacts hash  ·  impacts view --out ./site</text>

</svg>
