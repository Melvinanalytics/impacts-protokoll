<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="IMPACTS Seven-Phase Method Diagram">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e1e1b" stroke-width="1"/>
    </pattern>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9c9b94"/>
    </marker>
    <marker id="arrow-go" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#58c45d"/>
    </marker>
    <marker id="arrow-gate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#a5b4fc"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#fb923c"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="#131312" stroke="#32322d" stroke-width="1"/>
  
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="url(#grid)"/>
  <text x="44" y="44" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#9c9b94">SEVEN-PHASE METHOD</text>
  <text x="44" y="72" class="sans" font-size="22" font-weight="700" fill="#f1f0ec">Design backwards from the owed Leistung. Minimize before you automate.</text>

  <!-- Backward pull bar -->
  <path d="M 1076 108 L 122 108" fill="none" stroke="#dfc068" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <rect x="440" y="95" width="320" height="24" rx="12" fill="#282210" stroke="#52451f"/>
  <text x="600" y="111" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#dfc068">← REVERSE-ENGINEER FROM LEISTUNG</text>

  <rect x="44" y="136" width="144" height="96" rx="10" fill="#1b1b19" stroke="#4a4a43" stroke-width="1.1"/>
  <rect x="56" y="148" width="26" height="26" rx="6" fill="#f1f0ec"/>
  <text x="69" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#131312">I</text>
  <text x="90" y="166" class="sans" font-size="14" font-weight="700" fill="#f1f0ec">Identify</text>
  <text x="56" y="198" class="sans" font-size="12" fill="#9c9b94">Observe real work</text>
  <text x="56" y="218" class="mono" font-size="10" fill="#9c9b94">PHASE 01</text>

  <line x1="190" y1="184" x2="200" y2="184" stroke="#9c9b94" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="204" y="136" width="144" height="96" rx="10" fill="#2b190f" stroke="#fb923c" stroke-width="1.6"/>
  <rect x="216" y="148" width="26" height="26" rx="6" fill="#fb923c"/>
  <text x="229" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#ffffff">M</text>
  <text x="250" y="166" class="sans" font-size="14" font-weight="700" fill="#f1f0ec">Minimize</text>
  <text x="216" y="198" class="sans" font-size="12" fill="#fb923c">Cut unneeded work</text>
  <text x="216" y="218" class="mono" font-size="10" fill="#9c9b94">PHASE 02</text>

  <line x1="350" y1="184" x2="360" y2="184" stroke="#9c9b94" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="364" y="136" width="144" height="96" rx="10" fill="#1b1b19" stroke="#4a4a43" stroke-width="1.1"/>
  <rect x="376" y="148" width="26" height="26" rx="6" fill="#f1f0ec"/>
  <text x="389" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#131312">P</text>
  <text x="410" y="166" class="sans" font-size="14" font-weight="700" fill="#f1f0ec">Perfect</text>
  <text x="376" y="198" class="sans" font-size="12" fill="#9c9b94">Cut boundaries</text>
  <text x="376" y="218" class="mono" font-size="10" fill="#9c9b94">PHASE 03</text>

  <line x1="510" y1="184" x2="520" y2="184" stroke="#9c9b94" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="524" y="136" width="144" height="96" rx="10" fill="#1b1b19" stroke="#4a4a43" stroke-width="1.1"/>
  <rect x="536" y="148" width="26" height="26" rx="6" fill="#f1f0ec"/>
  <text x="549" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#131312">A</text>
  <text x="570" y="166" class="sans" font-size="14" font-weight="700" fill="#f1f0ec">Augment</text>
  <text x="536" y="198" class="sans" font-size="12" fill="#9c9b94">Context + checks</text>
  <text x="536" y="218" class="mono" font-size="10" fill="#9c9b94">PHASE 04</text>

  <line x1="670" y1="184" x2="680" y2="184" stroke="#9c9b94" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="684" y="136" width="144" height="96" rx="10" fill="#1b1b19" stroke="#4a4a43" stroke-width="1.1"/>
  <rect x="696" y="148" width="26" height="26" rx="6" fill="#f1f0ec"/>
  <text x="709" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#131312">C</text>
  <text x="730" y="166" class="sans" font-size="14" font-weight="700" fill="#f1f0ec">Construct</text>
  <text x="696" y="198" class="sans" font-size="12" fill="#9c9b94">Bind Hauptprozess</text>
  <text x="696" y="218" class="mono" font-size="10" fill="#9c9b94">PHASE 05</text>

  <line x1="830" y1="184" x2="840" y2="184" stroke="#9c9b94" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="844" y="136" width="144" height="96" rx="10" fill="#1b1b19" stroke="#4a4a43" stroke-width="1.1"/>
  <rect x="856" y="148" width="26" height="26" rx="6" fill="#f1f0ec"/>
  <text x="869" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#131312">T</text>
  <text x="890" y="166" class="sans" font-size="14" font-weight="700" fill="#f1f0ec">Test</text>
  <text x="856" y="198" class="sans" font-size="12" fill="#9c9b94">Walk &amp; verify</text>
  <text x="856" y="218" class="mono" font-size="10" fill="#9c9b94">PHASE 06</text>

  <line x1="990" y1="184" x2="1000" y2="184" stroke="#9c9b94" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="1004" y="136" width="144" height="96" rx="10" fill="#1b1b19" stroke="#4a4a43" stroke-width="1.1"/>
  <rect x="1016" y="148" width="26" height="26" rx="6" fill="#f1f0ec"/>
  <text x="1029" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#131312">S</text>
  <text x="1050" y="166" class="sans" font-size="14" font-weight="700" fill="#f1f0ec">Scale</text>
  <text x="1016" y="198" class="sans" font-size="12" fill="#9c9b94">Commit &amp; refine</text>
  <text x="1016" y="218" class="mono" font-size="10" fill="#9c9b94">PHASE 07</text>

  <!-- Plain Markdown span (I-M-P-A) -->
  <rect x="44" y="254" width="624" height="36" rx="8" fill="#242421" stroke="#4a4a43"/>
  <text x="60" y="276" class="mono" font-size="11.5" font-weight="700" fill="#dcdbd5">PLAIN MARKDOWN SUFFICES</text>
  <text x="652" y="276" text-anchor="end" class="sans" font-size="12" fill="#9c9b94">Stop here unless repeatability earns Core</text>

  <!-- Core binding span (C-T-S) -->
  <rect x="684" y="254" width="464" height="36" rx="8" fill="#152817" stroke="#294d2c"/>
  <text x="700" y="276" class="mono" font-size="11.5" font-weight="700" fill="#58c45d">OPTIONAL CORE BINDING</text>
  <text x="1132" y="276" text-anchor="end" class="sans" font-size="12" fill="#58c45d">Git trees · SHA-256 · CLI + Viewer</text>

</svg>
