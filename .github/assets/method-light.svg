<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="IMPACTS Seven-Phase Method Diagram">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#efefe9" stroke-width="1"/>
    </pattern>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#666660"/>
    </marker>
    <marker id="arrow-go" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2f7d32"/>
    </marker>
    <marker id="arrow-gate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#3346a8"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c2410c"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="#ffffff" stroke="#e1e1da" stroke-width="1"/>
  
  <rect x="1" y="1" width="1198" height="318" rx="13" fill="url(#grid)"/>
  <text x="44" y="44" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#666660">SEVEN-PHASE METHOD</text>
  <text x="44" y="72" class="sans" font-size="22" font-weight="700" fill="#121212">Design backwards from the owed Leistung. Minimize before you automate.</text>

  <!-- Backward pull bar -->
  <path d="M 1076 108 L 122 108" fill="none" stroke="#8a6d1d" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
  <rect x="440" y="95" width="320" height="24" rx="12" fill="#fbf6e5" stroke="#e5d59c"/>
  <text x="600" y="111" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#8a6d1d">← REVERSE-ENGINEER FROM LEISTUNG</text>

  <rect x="44" y="136" width="144" height="96" rx="10" fill="#f8f8f5" stroke="#c8c8be" stroke-width="1.1"/>
  <rect x="56" y="148" width="26" height="26" rx="6" fill="#121212"/>
  <text x="69" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#ffffff">I</text>
  <text x="90" y="166" class="sans" font-size="14" font-weight="700" fill="#121212">Identify</text>
  <text x="56" y="198" class="sans" font-size="12" fill="#666660">Observe real work</text>
  <text x="56" y="218" class="mono" font-size="10" fill="#666660">PHASE 01</text>

  <line x1="190" y1="184" x2="200" y2="184" stroke="#666660" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="204" y="136" width="144" height="96" rx="10" fill="#fff3eb" stroke="#c2410c" stroke-width="1.6"/>
  <rect x="216" y="148" width="26" height="26" rx="6" fill="#c2410c"/>
  <text x="229" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#ffffff">M</text>
  <text x="250" y="166" class="sans" font-size="14" font-weight="700" fill="#121212">Minimize</text>
  <text x="216" y="198" class="sans" font-size="12" fill="#c2410c">Cut unneeded work</text>
  <text x="216" y="218" class="mono" font-size="10" fill="#666660">PHASE 02</text>

  <line x1="350" y1="184" x2="360" y2="184" stroke="#666660" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="364" y="136" width="144" height="96" rx="10" fill="#f8f8f5" stroke="#c8c8be" stroke-width="1.1"/>
  <rect x="376" y="148" width="26" height="26" rx="6" fill="#121212"/>
  <text x="389" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#ffffff">P</text>
  <text x="410" y="166" class="sans" font-size="14" font-weight="700" fill="#121212">Perfect</text>
  <text x="376" y="198" class="sans" font-size="12" fill="#666660">Cut boundaries</text>
  <text x="376" y="218" class="mono" font-size="10" fill="#666660">PHASE 03</text>

  <line x1="510" y1="184" x2="520" y2="184" stroke="#666660" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="524" y="136" width="144" height="96" rx="10" fill="#f8f8f5" stroke="#c8c8be" stroke-width="1.1"/>
  <rect x="536" y="148" width="26" height="26" rx="6" fill="#121212"/>
  <text x="549" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#ffffff">A</text>
  <text x="570" y="166" class="sans" font-size="14" font-weight="700" fill="#121212">Augment</text>
  <text x="536" y="198" class="sans" font-size="12" fill="#666660">Context + checks</text>
  <text x="536" y="218" class="mono" font-size="10" fill="#666660">PHASE 04</text>

  <line x1="670" y1="184" x2="680" y2="184" stroke="#666660" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="684" y="136" width="144" height="96" rx="10" fill="#f8f8f5" stroke="#c8c8be" stroke-width="1.1"/>
  <rect x="696" y="148" width="26" height="26" rx="6" fill="#121212"/>
  <text x="709" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#ffffff">C</text>
  <text x="730" y="166" class="sans" font-size="14" font-weight="700" fill="#121212">Construct</text>
  <text x="696" y="198" class="sans" font-size="12" fill="#666660">Bind Hauptprozess</text>
  <text x="696" y="218" class="mono" font-size="10" fill="#666660">PHASE 05</text>

  <line x1="830" y1="184" x2="840" y2="184" stroke="#666660" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="844" y="136" width="144" height="96" rx="10" fill="#f8f8f5" stroke="#c8c8be" stroke-width="1.1"/>
  <rect x="856" y="148" width="26" height="26" rx="6" fill="#121212"/>
  <text x="869" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#ffffff">T</text>
  <text x="890" y="166" class="sans" font-size="14" font-weight="700" fill="#121212">Test</text>
  <text x="856" y="198" class="sans" font-size="12" fill="#666660">Walk &amp; verify</text>
  <text x="856" y="218" class="mono" font-size="10" fill="#666660">PHASE 06</text>

  <line x1="990" y1="184" x2="1000" y2="184" stroke="#666660" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <rect x="1004" y="136" width="144" height="96" rx="10" fill="#f8f8f5" stroke="#c8c8be" stroke-width="1.1"/>
  <rect x="1016" y="148" width="26" height="26" rx="6" fill="#121212"/>
  <text x="1029" y="165" text-anchor="middle" class="mono" font-size="13" font-weight="800" fill="#ffffff">S</text>
  <text x="1050" y="166" class="sans" font-size="14" font-weight="700" fill="#121212">Scale</text>
  <text x="1016" y="198" class="sans" font-size="12" fill="#666660">Commit &amp; refine</text>
  <text x="1016" y="218" class="mono" font-size="10" fill="#666660">PHASE 07</text>

  <!-- Plain Markdown span (I-M-P-A) -->
  <rect x="44" y="254" width="624" height="36" rx="8" fill="#f1f1ed" stroke="#c8c8be"/>
  <text x="60" y="276" class="mono" font-size="11.5" font-weight="700" fill="#2c2c29">PLAIN MARKDOWN SUFFICES</text>
  <text x="652" y="276" text-anchor="end" class="sans" font-size="12" fill="#666660">Stop here unless repeatability earns Core</text>

  <!-- Core binding span (C-T-S) -->
  <rect x="684" y="254" width="464" height="36" rx="8" fill="#ebf6ec" stroke="#b8dfb9"/>
  <text x="700" y="276" class="mono" font-size="11.5" font-weight="700" fill="#2f7d32">OPTIONAL CORE BINDING</text>
  <text x="1132" y="276" text-anchor="end" class="sans" font-size="12" fill="#2f7d32">Git trees · SHA-256 · CLI + Viewer</text>

</svg>
