<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="IMPACTS Protocol Hero Diagram">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e1e1b" stroke-width="1"/>
    </pattern>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#9c9b94"/>
    </marker>
    <marker id="arrow-go" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#58c45d"/>
    </marker>
    <marker id="arrow-gate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#a5b4fc"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#fb923c"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="14" fill="#131312" stroke="#32322d" stroke-width="1"/>
  
  <rect x="1" y="1" width="1198" height="358" rx="13" fill="url(#grid)"/>
  <!-- Left editorial block -->
  <rect x="44" y="42" width="108" height="24" rx="12" fill="#f1f0ec"/>
  <text x="98" y="58" text-anchor="middle" class="mono" font-size="11" font-weight="700" letter-spacing="1.2" fill="#131312">PROTOCOL</text>
  <rect x="162" y="42" width="244" height="24" rx="12" fill="#242421" stroke="#32322d"/>
  <text x="284" y="58" text-anchor="middle" class="mono" font-size="11" fill="#9c9b94">PLAIN FILES · GIT · ZERO SERVER</text>

  <text x="44" y="138" class="sans" font-size="60" font-weight="800" letter-spacing="-2" fill="#f1f0ec">IMPACTS</text>
  <text x="46" y="176" class="sans" font-size="19" font-weight="600" fill="#dcdbd5">Folder-directed, plain-file protocol for</text>
  <text x="46" y="202" class="sans" font-size="19" font-weight="600" fill="#dcdbd5">people and file-capable agents.</text>

  <text x="46" y="242" class="sans" font-size="14" fill="#9c9b94">Design backwards from the owed Leistung. Cut unneeded work first.</text>
  <text x="46" y="263" class="sans" font-size="14" fill="#9c9b94">Bind inputs, checks and human decisions in ordinary files + Git.</text>

  <!-- 3 bottom badges -->
  <g transform="translate(46, 290)">
    <rect x="0" y="0" width="142" height="30" rx="6" fill="#152817" stroke="#294d2c"/>
    <circle cx="16" cy="15" r="4" fill="#58c45d"/>
    <text x="28" y="19" class="mono" font-size="11.5" font-weight="600" fill="#58c45d">sha256 bound</text>

    <rect x="154" y="0" width="150" height="30" rx="6" fill="#1b1f36" stroke="#333d6e"/>
    <circle cx="170" cy="15" r="4" fill="#a5b4fc"/>
    <text x="182" y="19" class="mono" font-size="11.5" font-weight="600" fill="#a5b4fc">gate: human</text>

    <rect x="316" y="0" width="166" height="30" rx="6" fill="#282210" stroke="#52451f"/>
    <circle cx="332" cy="15" r="4" fill="#dfc068"/>
    <text x="344" y="19" class="mono" font-size="11.5" font-weight="600" fill="#dfc068">static HTML view</text>
  </g>

  <!-- Right architectural proof chain panel -->
  <rect x="596" y="34" width="564" height="292" rx="12" fill="#1b1b19" stroke="#4a4a43"/>
  <text x="620" y="60" class="mono" font-size="11" font-weight="700" letter-spacing="1" fill="#9c9b94">INSPECTABLE EXECUTION CHAIN</text>
  <text x="1136" y="60" text-anchor="end" class="mono" font-size="11" fill="#58c45d">● valid</text>
  <line x1="620" y1="72" x2="1136" y2="72" stroke="#32322d"/>

  <!-- Node 1: Root Router -->
  <rect x="620" y="92" width="238" height="62" rx="8" fill="#131312" stroke="#4a4a43"/>
  <text x="634" y="114" class="mono" font-size="12" font-weight="700" fill="#f1f0ec">CONTEXT.md</text>
  <text x="844" y="114" text-anchor="end" class="mono" font-size="10" fill="#9c9b94">ROUTE</text>
  <text x="634" y="135" class="mono" font-size="10" fill="#9c9b94">Form: records/ Record Library</text>

  <!-- Arrow 1->2 -->
  <line x1="858" y1="123" x2="892" y2="123" stroke="#9c9b94" stroke-width="1.5" marker-end="url(#arrow-muted)"/>

  <!-- Node 2: Hauptprozess -->
  <rect x="898" y="92" width="238" height="62" rx="8" fill="#131312" stroke="#4a4a43"/>
  <text x="912" y="114" class="mono" font-size="12" font-weight="700" fill="#f1f0ec">hauptprozesse/offer/</text>
  <text x="912" y="135" class="mono" font-size="10.5" fill="#dfc068">git-tree:a9f3e1…</text>

  <!-- Vertical arrow 2->4 -->
  <line x1="1017" y1="154" x2="1017" y2="188" stroke="#58c45d" stroke-width="1.8" marker-end="url(#arrow-go)"/>

  <!-- Node 3: Vorgang -->
  <rect x="620" y="194" width="238" height="66" rx="8" fill="#152817" stroke="#294d2c"/>
  <text x="634" y="216" class="mono" font-size="12" font-weight="700" fill="#58c45d">vorgaenge/case-042/</text>
  <text x="634" y="234" class="mono" font-size="10" fill="#dcdbd5">gelesen:     sha256:9d1c…</text>
  <text x="634" y="249" class="mono" font-size="10" fill="#dcdbd5">geschrieben: sha256:4b82…</text>

  <!-- Node 4: Human Gate -->
  <rect x="898" y="194" width="238" height="66" rx="8" fill="#1b1f36" stroke="#333d6e"/>
  <text x="912" y="216" class="mono" font-size="12" font-weight="700" fill="#a5b4fc">gate: human</text>
  <text x="1122" y="216" text-anchor="end" class="mono" font-size="10" fill="#a5b4fc">EXPLICIT</text>
  <text x="912" y="234" class="mono" font-size="10.5" fill="#dcdbd5">by: human:clara</text>
  <text x="912" y="249" class="mono" font-size="10.5" fill="#9c9b94">route: freigegeben</text>

  <!-- Arrow 4->3 -->
  <line x1="898" y1="227" x2="864" y2="227" stroke="#a5b4fc" stroke-width="1.8" marker-end="url(#arrow-gate)"/>

  <!-- Bottom CLI strip inside panel -->
  <rect x="620" y="276" width="516" height="32" rx="6" fill="#242421" stroke="#32322d"/>
  <text x="634" y="296" class="mono" font-size="11.5" fill="#dcdbd5">$ impacts validate .  ·  impacts hash  ·  impacts view --out ./site</text>

</svg>
