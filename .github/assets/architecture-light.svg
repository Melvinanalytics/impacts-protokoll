<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="444" viewBox="0 0 1200 444" role="img" aria-label="IMPACTS Workspace Architecture and Static HTML Viewer">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#efefe9" stroke-width="1"/>
    </pattern>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#666660"/>
    </marker>
    <marker id="arrow-go" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2f7d32"/>
    </marker>
    <marker id="arrow-gate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#3346a8"/>
    </marker>
    <marker id="arrow-open" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#c2410c"/>
    </marker>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="443" rx="14" fill="#ffffff" stroke="#e1e1da" stroke-width="1"/>
  
  <text x="44" y="42" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#666660">WORKSPACE ARCHITECTURE</text>
  <text x="44" y="70" class="sans" font-size="24" font-weight="700" fill="#121212">One Git repository, declared folder forms, read-only verification</text>

  <!-- Column 1: Workspace Folder Tree -->
  <rect x="44" y="96" width="380" height="328" rx="12" fill="#f8f8f5" stroke="#c8c8be"/>
  <text x="64" y="122" class="mono" font-size="11.5" font-weight="700" fill="#666660">CUSTOMER WORKSPACE (GIT ROOT)</text>
  <line x1="64" y1="134" x2="404" y2="134" stroke="#e1e1da"/>

  <g class="mono" font-size="12">
    <text x="64" y="160" font-weight="700" fill="#121212">├── CONTEXT.md</text>
    <text x="398" y="160" text-anchor="end" font-size="10.5" fill="#666660">root router + pin</text>

    <text x="64" y="192" font-weight="700" fill="#121212">├── grundlagen/</text>
    <rect x="272" y="177" width="130" height="20" rx="4" fill="#fbf6e5" stroke="#e5d59c"/>
    <text x="337" y="191" text-anchor="middle" font-size="10" font-weight="700" fill="#8a6d1d">Knowledge Bundle</text>

    <text x="64" y="224" font-weight="700" fill="#121212">├── records/</text>
    <rect x="272" y="209" width="130" height="20" rx="4" fill="#f1f1ed" stroke="#c8c8be"/>
    <text x="337" y="223" text-anchor="middle" font-size="10" font-weight="700" fill="#2c2c29">Record Library</text>

    <text x="64" y="256" font-weight="700" fill="#121212">├── analyse/</text>
    <rect x="272" y="241" width="130" height="20" rx="4" fill="#f1f1ed" stroke="#c8c8be"/>
    <text x="337" y="255" text-anchor="middle" font-size="10" font-weight="700" fill="#2c2c29">Context Map</text>

    <text x="64" y="288" font-weight="700" fill="#121212">├── capabilities/</text>
    <rect x="272" y="273" width="130" height="20" rx="4" fill="#f1f1ed" stroke="#c8c8be"/>
    <text x="337" y="287" text-anchor="middle" font-size="10" font-weight="700" fill="#2c2c29">Capability</text>

    <text x="64" y="328" font-weight="700" fill="#3346a8">├── hauptprozesse/</text>
    <rect x="272" y="313" width="130" height="20" rx="4" fill="#eef0fb" stroke="#c2caf2"/>
    <text x="337" y="327" text-anchor="middle" font-size="10" font-weight="700" fill="#3346a8">git-tree bound</text>
    <text x="82" y="348" font-size="10.5" fill="#666660">└─ &lt;slug&gt;/&lt;tp&gt;/&lt;as&gt;/CONTEXT.md</text>

    <text x="64" y="382" font-weight="700" fill="#2f7d32">└── vorgaenge/</text>
    <rect x="272" y="367" width="130" height="20" rx="4" fill="#ebf6ec" stroke="#b8dfb9"/>
    <text x="337" y="381" text-anchor="middle" font-size="10" font-weight="700" fill="#2f7d32">laufpfad + sha256</text>
    <text x="82" y="402" font-size="10.5" fill="#666660">└─ &lt;case&gt;/&lt;as&gt;/001/output/</text>
  </g>

  <!-- Connector Arrows Col 1 -> Col 2 -->
  <line x1="424" y1="200" x2="478" y2="200" stroke="#666660" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
  <line x1="424" y1="322" x2="478" y2="322" stroke="#3346a8" stroke-width="1.6" marker-end="url(#arrow-gate)"/>
  <line x1="424" y1="382" x2="478" y2="382" stroke="#2f7d32" stroke-width="1.6" marker-end="url(#arrow-go)"/>

  <!-- Column 2: Read-Only CLI Core -->
  <rect x="484" y="96" width="286" height="328" rx="12" fill="#f8f8f5" stroke="#c8c8be"/>
  <text x="504" y="122" class="mono" font-size="11.5" font-weight="700" fill="#666660">CORE CLI (READ-ONLY)</text>
  <line x1="504" y1="134" x2="750" y2="134" stroke="#e1e1da"/>

  <rect x="504" y="152" width="246" height="72" rx="8" fill="#ffffff" stroke="#c8c8be"/>
  <text x="518" y="174" class="mono" font-size="12.5" font-weight="700" fill="#121212">impacts validate</text>
  <text x="518" y="193" class="sans" font-size="11.5" fill="#666660">Checks schemas, links, forms,</text>
  <text x="518" y="209" class="sans" font-size="11.5" fill="#666660">digests &amp; routes → exit 0 / 1</text>

  <rect x="504" y="238" width="246" height="72" rx="8" fill="#ffffff" stroke="#c8c8be"/>
  <text x="518" y="260" class="mono" font-size="12.5" font-weight="700" fill="#121212">impacts hash</text>
  <text x="518" y="279" class="sans" font-size="11.5" fill="#666660">Per-file SHA-256 references</text>
  <text x="518" y="295" class="sans" font-size="11.5" fill="#666660">for gelesen &amp; geschrieben</text>

  <rect x="504" y="324" width="246" height="80" rx="8" fill="#ffffff" stroke="#b8dfb9"/>
  <text x="518" y="346" class="mono" font-size="12.5" font-weight="700" fill="#2f7d32">impacts view</text>
  <text x="518" y="365" class="sans" font-size="11.5" fill="#666660">Exports zero-server static HTML</text>
  <text x="518" y="381" class="sans" font-size="11.5" fill="#666660">+ optional model.json projection</text>

  <!-- Connector Col 2 -> Col 3 -->
  <line x1="770" y1="260" x2="824" y2="260" stroke="#2f7d32" stroke-width="1.8" marker-end="url(#arrow-go)"/>

  <!-- Column 3: Static HTML View Mockup -->
  <rect x="830" y="96" width="326" height="328" rx="12" fill="#ffffff" stroke="#121212" stroke-width="1.4"/>
  <!-- Mockup top bar -->
  <rect x="831" y="97" width="324" height="34" rx="11" fill="#f1f1ed"/>
  <rect x="831" y="118" width="324" height="13" fill="#f1f1ed"/>
  <line x1="831" y1="131" x2="1155" y2="131" stroke="#e1e1da"/>
  <circle cx="848" cy="114" r="4" fill="#c8c8be"/>
  <circle cx="862" cy="114" r="4" fill="#c8c8be"/>
  <circle cx="876" cy="114" r="4" fill="#c8c8be"/>
  <text x="1140" y="118" text-anchor="end" class="mono" font-size="10.5" fill="#666660">impacts view · static HTML</text>

  <!-- Mini Viewer Content -->
  <text x="850" y="158" class="sans" font-size="16" font-weight="800" fill="#121212">offer-2026-042</text>
  <rect x="1062" y="143" width="76" height="20" rx="10" fill="#ebf6ec" stroke="#b8dfb9"/>
  <text x="1100" y="157" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#2f7d32">aktiv</text>
  <text x="850" y="176" class="mono" font-size="10" fill="#666660">git-tree:a9f3e1 · protocol: v0.9.0</text>
  <line x1="850" y1="188" x2="1138" y2="188" stroke="#121212" stroke-width="1.5"/>

  <!-- Mini route map inside viewer mockup -->
  <rect x="850" y="202" width="84" height="44" rx="6" fill="#f1f1ed" stroke="#c8c8be"/>
  <text x="892" y="220" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#666660">01 Intake</text>
  <text x="892" y="236" text-anchor="middle" class="mono" font-size="9.5" fill="#2f7d32">✓ done</text>

  <line x1="934" y1="224" x2="956" y2="224" stroke="#2f7d32" stroke-width="2"/>

  <rect x="956" y="202" width="86" height="44" rx="6" fill="#ebf6ec" stroke="#2f7d32" stroke-width="1.6"/>
  <text x="999" y="220" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#121212">02 Price</text>
  <text x="999" y="236" text-anchor="middle" class="mono" font-size="9.5" fill="#2f7d32">● aktiv</text>

  <line x1="1042" y1="224" x2="1064" y2="224" stroke="#c8c8be" stroke-width="1.5" stroke-dasharray="3 3"/>

  <rect x="1064" y="202" width="74" height="44" rx="6" fill="#eef0fb" stroke="#c2caf2"/>
  <text x="1101" y="220" text-anchor="middle" class="sans" font-size="10.5" font-weight="700" fill="#3346a8">03 Gate</text>
  <text x="1101" y="236" text-anchor="middle" class="mono" font-size="9" fill="#3346a8">human</text>

  <!-- Evidence ledger lines inside mockup -->
  <rect x="850" y="264" width="288" height="142" rx="8" fill="#f8f8f5" stroke="#e1e1da"/>
  <text x="864" y="286" class="mono" font-size="10" font-weight="700" fill="#666660">BOUND EVIDENCE</text>
  <line x1="864" y1="295" x2="1124" y2="295" stroke="#e1e1da"/>
  <text x="864" y="314" class="mono" font-size="10.5" fill="#2c2c29">gelesen   rules.md      sha256:9d1c…</text>
  <text x="864" y="334" class="mono" font-size="10.5" fill="#2c2c29">output    quote.pdf     sha256:4b82…</text>
  <text x="864" y="354" class="mono" font-size="10.5" fill="#3346a8">gate      human:clara   pending</text>
  <text x="864" y="374" class="mono" font-size="10.5" fill="#8a6d1d">subject   records/c-42  stage: review</text>
  <text x="864" y="394" class="mono" font-size="10" fill="#666660">read-only projection · decides nothing</text>

</svg>
