name: Independent implementation result
description: Submit a bounded candidate result for the public structural challenge.
title: "[Independent implementation]: "
body:
  - type: markdown
    attributes:
      value: Complete the written independent implementation challenge and link its retained public evidence record here.
  - type: input
    id: candidate_revision
    attributes:
      label: Candidate source and revision
      description: Public source, retained revision, and executable.
    validations:
      required: true
  - type: textarea
    id: prior_exposure
    attributes:
      label: Prior source exposure
      description: Source, implementation tests, fixtures, or generated reports seen before candidate work; unknown stays unknown.
    validations:
      required: true
  - type: textarea
    id: ai_assistance
    attributes:
      label: AI assistance
      description: AI systems or tools used, their role, and which outputs were reviewed; state none if none.
    validations:
      required: true
  - type: textarea
    id: evidence_record
    attributes:
      label: Challenge evidence record
      description: Public link to command, environment, corpus and extra-case results, unsupported reasons, and checks not performed.
    validations:
      required: true
