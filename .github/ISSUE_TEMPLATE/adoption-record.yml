name: Bounded adoption or listening result
description: Submit a completed first-use record or listening-screen result with its actual scope.
title: "[Adoption evidence]: "
body:
  - type: markdown
    attributes:
      value: >-
        Public adoption records accept only synthetic or already-public evidence,
        a non-sensitive reference and bounded scope, and a sanitized summary.
        Keep customer records and raw sources, captured outputs, review records,
        personal data, credentials, and private access state in the customer repository;
        do not link or attach them here.
  - type: dropdown
    id: contribution_kind
    attributes:
      label: Contribution kind
      options:
        - Unaccompanied first use
        - Bounded listening-adapter screen
    validations:
      required: true
  - type: input
    id: candidate_revision
    attributes:
      label: Candidate source/procedure revision
      description: Public protocol, procedure, and adapter revisions.
    validations:
      required: true
  - type: textarea
    id: participants_and_scope
    attributes:
      label: Participant/operator scope
      description: Aggregate count, broad role, bounded scope, and whether use was unaccompanied.
    validations:
      required: true
  - type: dropdown
    id: evidence_kind
    attributes:
      label: Public evidence kind
      options:
        - Synthetic evidence
        - Already-public evidence
    validations:
      required: true
  - type: textarea
    id: public_reference_and_scope
    attributes:
      label: Public reference and inspected scope
      description: Non-sensitive public evidence link and inspected scope.
    validations:
      required: true
  - type: textarea
    id: checks_and_adverse_actions
    attributes:
      label: Checks, adverse actions and open results
      description: Sanitized result summary, denominators, adverse actions, missing data, and open results.
    validations:
      required: true
  - type: textarea
    id: effort_and_limits
    attributes:
      label: Effort and limits
      description: Active effort, elapsed time, checks not performed, and claim limits.
    validations:
      required: true
