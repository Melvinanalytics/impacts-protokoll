name: Evidence-backed finding
description: Report a scoped diagnostic, distribution, platform, dependency, or reproducibility finding.
title: "[Finding]: "
body:
  - type: markdown
    attributes:
      value: Follow the public evidence scope in `CONTRIBUTING.md`.
  - type: input
    id: source_revision
    attributes:
      label: Source revision or installed edition
      description: Commit, tag, package edition, or unknown.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and evidence
      description: Command, environment, exit status, output, and public evidence link.
    validations:
      required: true
  - type: textarea
    id: expected_observed
    attributes:
      label: Expected and observed behavior
      description: Expected result, observed result, and inspected scope.
    validations:
      required: true
  - type: textarea
    id: checks_not_performed
    attributes:
      label: Checks not performed
      description: Checks not run and dependent conclusions that remain open.
    validations:
      required: true
