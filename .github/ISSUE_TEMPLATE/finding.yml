name: Evidence-backed finding
description: Report a scoped diagnostic, distribution, platform, dependency, or reproducibility finding.
title: "[Finding]: "
body:
  - type: markdown
    attributes:
      value: >-
        Report only evidence you observed. Keep customer and personal data, credentials,
        private logs, and access state out of this issue. A name, reviewer label, or
        `human:<id>` is attribution only; it does not establish identity or approval.
  - type: dropdown
    id: finding_class
    attributes:
      label: Finding class
      options:
        - Diagnostics
        - Provenance-template distribution
        - Durable native release evidence
        - NTFS and platform boundary
        - Dependency closure for the bounded target
        - Public-review reproducibility
    validations:
      required: true
  - type: input
    id: source_revision
    attributes:
      label: Source revision or installed edition
      description: Give commit/tag and package edition when known. State unknown values as unknown.
      placeholder: commit, tag, package version, or unknown
    validations:
      required: true
  - type: textarea
    id: inspected_scope
    attributes:
      label: Inspected scope
      description: Name OS/filesystem/runtime, corpus case, wheel, workflow, and exact boundaries relevant to the finding.
    validations:
      required: true
  - type: textarea
    id: evidence_source
    attributes:
      label: Evidence and source
      description: Link public synthetic inputs and retained output, or describe their repository paths. Do not attach private data.
    validations:
      required: true
  - type: textarea
    id: expected_observed
    attributes:
      label: Expected and observed behavior
      description: Separate stated expectation from the actual result and its source.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Exact reproduction command and result
      description: Include command, exit status, report or unsupported reason, and relevant public workflow URL/attempt if applicable.
    validations:
      required: true
  - type: textarea
    id: checks_and_gaps
    attributes:
      label: Checks performed and not performed
      description: State what ran, what did not run, and which dependent conclusions remain open.
    validations:
      required: true
