name: Publish tagged release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing annotated tag to publish, for example v0.3.9
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      DIST_DIR: release-dist
    steps:
      - name: Validate requested tag name
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Verify annotated tag and release claims
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python .github/scripts/release_guard.py source --root . --tag "${RELEASE_TAG}"

      - name: Test the exact tagged source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "build==1.6.1" "pytest==9.1.1" "setuptools==82.0.1" "wheel==0.48.0"
          python -m pip install --disable-pip-version-check -e .
          python -m pytest -q

      - name: Build wheel, complete source archive and checksums
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          wheel="impacts_protocol-${version}-py3-none-any.whl"
          source="impacts-protokoll-${version}-source.tar.gz"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          mkdir -p "${DIST_DIR}"
          python -m build --wheel --no-isolation --outdir "${DIST_DIR}"
          test -f "${DIST_DIR}/${wheel}"
          git archive --format=tar --prefix="impacts-protokoll-${version}/" HEAD \
            | gzip -n > "${DIST_DIR}/${source}"
          (
            cd "${DIST_DIR}"
            sha256sum "${wheel}" "${source}" > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          python .github/scripts/release_guard.py artifacts \
            --root . --dist "${DIST_DIR}" --tag "${RELEASE_TAG}"

      - name: Transfer checked release bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: ${{ env.DIST_DIR }}/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish checked bytes
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      DIST_DIR: release-dist
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate requested tag name
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Download checked release bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-${{ env.RELEASE_TAG }}
          path: ${{ env.DIST_DIR }}

      - name: Recheck tag and transferred bytes
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python .github/scripts/release_guard.py source --root . --tag "${RELEASE_TAG}"
          python .github/scripts/release_guard.py artifacts \
            --root . --dist "${DIST_DIR}" --tag "${RELEASE_TAG}"

      - name: Create or reuse exactly one hidden draft
        id: draft
        run: |
          set -euo pipefail
          releases="${RUNNER_TEMP}/matching-releases.json"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq --arg tag "${RELEASE_TAG}" \
                '[.[][] | select(.tag_name == $tag)]' > "${releases}"
          count="$(jq 'length' "${releases}")"
          if [ "${count}" -eq 0 ]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${RELEASE_TAG}" -f name="${RELEASE_TAG}" \
              -F draft=true -F generate_release_notes=true \
              > "${RUNNER_TEMP}/draft-release.json"
          elif [ "${count}" -eq 1 ]; then
            test "$(jq -r '.[0].draft' "${releases}")" = true
            jq '.[0]' "${releases}" > "${RUNNER_TEMP}/draft-release.json"
          else
            echo "Expected zero or one Release for ${RELEASE_TAG}, found ${count}" >&2
            exit 1
          fi
          release_id="$(jq -r .id "${RUNNER_TEMP}/draft-release.json")"
          [[ "${release_id}" =~ ^[0-9]+$ ]]
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"

      - name: Replace draft assets with the checked set
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            | jq -r '.[][] | .id' \
            | while IFS= read -r asset_id; do
                gh api --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
              done
          for path in "${DIST_DIR}"/*; do
            name="$(basename "${path}")"
            gh api --hostname uploads.github.com --method POST \
              "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}" \
              -H "Content-Type: application/octet-stream" --input "${path}" > /dev/null
          done

      - name: Verify draft, publish by ID, then verify public Release
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -euo pipefail
          python .github/scripts/release_guard.py live \
            --repository "${GITHUB_REPOSITORY}" --tag "${RELEASE_TAG}" \
            --release-id "${RELEASE_ID}" --expect-draft \
            --dist "${DIST_DIR}" --retries 12
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false > /dev/null
          python .github/scripts/release_guard.py live \
            --repository "${GITHUB_REPOSITORY}" --tag "${RELEASE_TAG}" \
            --dist "${DIST_DIR}" --retries 12
