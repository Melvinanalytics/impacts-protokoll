name: Pull request checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.14"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test environment
        run: |
          python -m pip install --disable-pip-version-check \
            "build==1.6.1" "pytest==9.1.1" "hypothesis==6.168.1" "setuptools==82.0.1" "wheel==0.48.0"
          python -m pip install --disable-pip-version-check -e ".[test]"

      - name: Run repository checks
        run: python -m pytest -q

  native-conformance:
    name: Native corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Check out candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Preserve Git fixture bytes on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git checkout-index --force --all

      - name: Set up Python 3.12
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install candidate CLI
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run frozen 19-case native portability corpus
        shell: pwsh
        run: |
          $output = @(& python 06_evaluations/conformance/run.py 2>&1)
          $runnerExit = $LASTEXITCODE
          $output | ForEach-Object { Write-Output ([string] $_) }
          if ($runnerExit -ne 0) { throw "Conformance runner exited with $runnerExit" }
          $summary = @($output | ForEach-Object { [string] $_ } | Where-Object { $_ -match '^Conformance summary: ' })
          $unsupported = @($output | ForEach-Object { [string] $_ } | Where-Object { $_ -match '^UNSUPPORTED ' })
          if ($unsupported.Count -gt 2) { throw "More than two corpus cases are unsupported" }
          $expectedPassed = 19 - $unsupported.Count
          $expectedSummary = "Conformance summary: applicable=$expectedPassed passed=$expectedPassed unsupported=$($unsupported.Count) failed=0 total=19"
          if ($summary.Count -ne 1 -or $summary[0] -ne $expectedSummary) {
            throw "Conformance summary is missing or inconsistent with the 19 case results"
          }
          $allowedUnsupported = @('hash-invalid-utf8-filename', 'run-invalid-utf8-filename')
          foreach ($line in $unsupported) {
            if ([string] $line -match '^UNSUPPORTED ([^:]+):') {
              if ($allowedUnsupported -notcontains $Matches[1]) {
                throw "Unexpected unsupported case: $($Matches[1])"
              }
            } else {
              throw "Malformed unsupported-case result: $line"
            }
          }
